<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harsha Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: capture first (a note box where you land), then "needs attention", then the week; sidebar mirrors agency → client. White, blue accent. */
:root{color-scheme:light;
  --bg:#FFFFFF;--soft:#F5F7FA;--soft2:#EEF1F6;--ink:#141A24;--muted:#626C7C;--line:#E3E7EE;
  --accent:#2459C9;--accent-ink:#FFFFFF;--accent-soft:#E8EEFC;--accent-line:#BFD0F5;
  --bad:#C0352B;--bad-soft:#FDECEA;--warn:#9A6211;--warn-soft:#FCF2DE;--ok:#2E7D4F;--ok-soft:#E5F3EA;
  --k-note:#2459C9;--k-note-soft:#E8EEFC;--k-change:#B4531F;--k-change-soft:#FCEBDF;--k-call:#6A4FC0;--k-call-soft:#EFEAFB;
  --t-report:#4A3FB0;--t-launch:#0E7490;--t-creative:#A2458F;--t-budget:#9A6211;--t-optim:#4F6B78;--t-call:#6A4FC0;--t-other:#8A93A3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.preview{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500;text-align:center;padding:5px 16px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 28px)}

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--line);padding:20px 12px 24px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 16px var(--f-display);flex:none}
.brand b{font:700 17px/1.1 var(--f-display);display:block}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink)}
.nb svg{flex:none;color:var(--muted)}
.nb:hover{background:var(--soft)}
.nb.on{background:var(--accent-soft);color:var(--accent)}
.nb.on svg{color:var(--accent)}
.nb .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.nb .n.bad{color:#fff;background:var(--bad);border-radius:99px;padding:0 7px}
.nb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tree{display:flex;flex-direction:column;gap:12px}
.tree-h{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.tree-h span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ag{display:flex;flex-direction:column;gap:1px}
.ag-n{font-size:12px;color:var(--muted);padding:2px 10px;font-weight:500}
.cb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 18px;border-radius:7px;cursor:pointer;font-size:14px}
.cb:hover{background:var(--soft)}
.cb.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.cb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .ago{font:500 11px var(--f-mono);color:var(--muted)}
.cb .ago.bad{color:var(--bad)}.cb .ago.warn{color:var(--warn)}
.cb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- top bar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 32px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.94);backdrop-filter:blur(6px);z-index:5}
.search{position:relative;display:block;flex:1 1 240px;max-width:520px}
.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 40px 9px 38px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--bg)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.kbd{font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.top .sp{flex:1}
.view{padding:28px 32px 96px;display:flex;flex-direction:column;gap:28px;max-width:1180px;width:100%}

/* ---------- type ---------- */
h1{font:700 30px/1.15 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:600 17px/1.3 var(--f-display);margin:0}
.lead{color:var(--muted);margin:6px 0 0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:30px}
.btn.ghost{border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.icon-btn{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.icon-btn:hover{background:var(--soft2);color:var(--ink)}
.icon-btn.danger:hover{color:var(--bad);background:var(--bad-soft)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;min-width:0;width:100%}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.field{resize:vertical;min-height:84px}

/* ---------- panels & lists ---------- */
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.list > *+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .t.done{text-decoration:line-through;color:var(--muted);font-weight:400}
.row .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.row:hover .acts,.row:focus-within .acts,.note:hover .acts,.note:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.empty{color:var(--muted);font-size:14px;padding:18px 16px;text-align:center}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;background:var(--soft2);color:var(--muted);white-space:nowrap;border:0}
.chip.c{background:var(--accent-soft);color:var(--accent);cursor:pointer}
.chip.c:hover{background:var(--accent-line)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
.kind{display:inline-flex;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.kind.note{background:var(--k-note-soft);color:var(--k-note)}.kind.change{background:var(--k-change-soft);color:var(--k-change)}.kind.call{background:var(--k-call-soft);color:var(--k-call)}
.type{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.type i{width:8px;height:8px;border-radius:2px}
.due{font:500 13px var(--f-mono);white-space:nowrap}
.due.bad{color:var(--bad)}.due.warn{color:var(--warn)}

/* ---------- composer ---------- */
.composer{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.composer:focus-within{border-color:var(--accent-line);background:var(--bg);box-shadow:0 0 0 4px var(--accent-soft)}
.composer textarea{border:0;background:transparent;resize:none;min-height:52px;padding:4px 4px;width:100%;outline:none;font-size:15px}
.composer .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.composer select{width:auto;max-width:220px;padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.hint{font-size:12px;color:var(--muted)}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:99px;background:var(--soft);font-size:13px;color:var(--muted)}
.stat b{font:600 15px var(--f-mono);color:var(--ink)}
.stat.bad{background:var(--bad-soft);color:var(--bad)}.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.att .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}
.att .ic.bad{background:var(--bad-soft);color:var(--bad)}.att .ic.warn{background:var(--warn-soft);color:var(--warn)}
.weekbar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week.with-late{grid-template-columns:repeat(8,minmax(0,1fr))}
.day{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.day:hover{border-color:var(--accent-line)}
.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.day .dd{font:600 17px/1 var(--f-mono)}
.day.today{background:var(--accent-soft);border-color:transparent}
.day.today .dn,.day.today .dd{color:var(--accent)}
.day.late{background:var(--bad-soft);border-color:transparent}
.day.late .dn,.day.late .dd{color:var(--bad)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bars{display:flex;gap:3px;flex-wrap:wrap;min-height:5px}
.bars i{width:12px;height:5px;border-radius:3px}
.dayhead{padding:8px 16px;background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.dayhead.today{color:var(--accent)}
.feed .note{padding:12px 16px}

/* ---------- notes ---------- */
.note{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.note .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.note .hd .acts{margin-left:auto}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.feed .note p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ftabs{display:flex;gap:4px;flex-wrap:wrap}
.ftab{all:unset;cursor:pointer;font-size:13px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.ftab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ftab:focus-visible{outline:2px solid var(--accent)}

/* ---------- clients ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--accent-line);box-shadow:0 4px 18px rgba(36,89,201,.08)}
.card:focus-visible{outline:2px solid var(--accent)}
.card .nm{font:600 17px var(--f-display)}
.card .ln{font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .ln span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card .ln span:last-child{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .ft{display:flex;gap:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}

/* ---------- client page ---------- */
.back{all:unset;cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.lk{min-width:0;display:flex;flex-direction:column}
.lk a{font-weight:500;text-decoration:none;overflow-wrap:anywhere;color:var(--ink)}
.lk a:hover{color:var(--accent);text-decoration:underline}
.lk small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;font:600 11px var(--f-mono);color:#fff}
.cred{display:flex;align-items:center;gap:6px;min-width:0}
.cred .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:38px;flex:none}
.cred .v{font:400 13px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.login{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:11px 16px}
.login .who{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:500}
.copy{all:unset;cursor:pointer;font-size:12px;color:var(--accent);padding:2px 6px;border-radius:5px;flex:none}
.copy:hover{background:var(--accent-soft)}
.copy:focus-visible{outline:2px solid var(--accent)}
.result{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.result .panel-h{background:var(--soft)}
mark{background:#FFF0A8;color:inherit;border-radius:2px;padding:0 1px}

/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.38);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;z-index:20;overflow:auto}
.modal{background:var(--bg);border-radius:16px;width:100%;max-width:520px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 70px rgba(16,24,40,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.f > .fl{font-size:13px;color:var(--muted);font-weight:500}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.pick label:has(input:focus-visible){outline:2px solid var(--accent)}
.pick i{width:8px;height:8px;border-radius:2px}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:30;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast button{all:unset;cursor:pointer;color:#9DB8F5;font-weight:600;padding:4px 10px;border-radius:7px}
.toast button:hover{background:rgba(255,255,255,.1)}
.toast span:only-child{padding-right:8px}

/* ---------- phone ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .top .kbd,.top .hide-sm{display:none}
  .view{padding:20px 16px 110px;gap:22px}
  .cols{grid-template-columns:1fr}
  .week,.week.with-late{grid-template-columns:repeat(4,minmax(0,1fr))}
  h1{font-size:26px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
  .tabbar button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:8px;cursor:pointer}
  .tabbar button.on{color:var(--accent)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){.fr{grid-template-columns:1fr}.login{grid-template-columns:1fr}.composer select{max-width:100%;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="preview">Preview with sample data. Nothing is saved yet.</div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="top">
      <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search clients, notes, links, emails" aria-label="Search" autocomplete="off"><span class="kbd">/</span></label>
      <span class="sp"></span>
      <button class="btn hide-sm" data-act="new-deadline">+ Deadline</button>
      <button class="btn pri" data-act="new-note">+ Note <span class="kbd hide-sm" style="background:transparent;color:#DCE6FB;border-color:rgba(255,255,255,.35)">N</span></button>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ---------- constants ---------- */
const TYPES={report:["Report","--t-report"],launch:["Launch","--t-launch"],creative:["Creatives","--t-creative"],budget:["Budget","--t-budget"],
  optim:["Optimisation","--t-optim"],call:["Call","--t-call"],other:["Other","--t-other"]};
const KINDS={note:"Note",change:"Change",call:"Call"};
const EVERY={"1":"every day","2":"every 2 days","3":"every 3 days","7":"every week","14":"every 2 weeks","30":"every month"};
const PLATFORMS=["Google Ads","Meta","GA4","Shopify","Amazon","LinkedIn"];
const REPEAT={"":"Doesn't repeat",weekly:"Every week",monthly:"Every month"};
const ICON={

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl=s=>{const t=esc(s);if(!S.q)return t;const q=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp("("+q+")","ig"),"<mark>$1</mark>")};
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toD=s=>new Date(s+"T00:00");
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return dstr(d)};
const addMonth=s=>{const d=toD(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dstr(d)};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt=s=>{if(!s)return"";const d=toD(s);return d.getDate()+" "+MON[d.getMonth()]};
const t0=dstr(new Date());
const diff=s=>Math.round((toD(s)-toD(t0))/864e5);
const ago=s=>{const n=-diff(s);return n<=0?"today":n===1?"yesterday":n+" days ago"};
const agoShort=n=>n===null?"never":n===0?"today":n+"d";
function countdown(s){if(!s)return["No date",""];const n=diff(s);if(n<0)return[(-n)+"d late","bad"];if(n===0)return["Today","warn"];if(n===1)return["Tomorrow","warn"];return["in "+n+"d",""]}
const safeUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(_){return u}};
const byId=(a,id)=>a.find(x=>x.id===id);
let nid=1;const newId=()=>"n"+(nid++);
const d=n=>addDays(t0,n);

/* ---------- derived ---------- */
const clientName=id=>byId(S.clients,id)?.name||"";
const agencyName=id=>byId(S.agencies,id)?.name||"Direct";
const sortedClients=()=>S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name));
const agencyGroups=()=>S.agencies.slice().sort((a,b)=>a.name.localeCompare(b.name)).concat([{id:"",name:"Direct clients"}])
  .map(a=>({...a,clients:sortedClients().filter(c=>(c.agencyId||"")===a.id)}));
const updatesOf=cid=>S.updates.filter(u=>u.clientId===cid).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const lastCheck=cid=>updatesOf(cid)[0]?.date||null;
const lastChange=cid=>updatesOf(cid).find(u=>u.kind==="change")||null;
function freshness(c){const l=lastCheck(c.id);if(!l)return{cls:"bad",days:null,ratio:2};
  const days=-diff(l),ratio=days/(c.every||7);return{cls:ratio>1?"bad":ratio>=.7?"warn":"ok",days,ratio}}
const open=cid=>S.deadlines.filter(t=>!t.done&&(!cid||t.clientId===cid)).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
const late=cid=>open(cid).filter(t=>t.date&&t.date<t0);
const stale=()=>S.clients.filter(c=>freshness(c).cls==="bad").sort((a,b)=>freshness(b).ratio-freshness(a).ratio);

/* ---------- small pieces ---------- */
const typeTag=k=>{const [l,v]=TYPES[k]||TYPES.other;return `<span class="type"><i style="background:var(${v})"></i>${l}</span>`};
const clientChip=id=>id?`<button class="chip c" data-act="client" data-id="${id}">${esc(clientName(id))}</button>`:"";
const acts=(edit,kind,id)=>`<span class="acts"><button class="icon-btn" data-act="${edit}" data-id="${id}" aria-label="Edit">Edit</button><button class="icon-btn danger" data-act="del" data-k="${kind}" data-id="${id}" aria-label="Delete">Delete</button></span>`;
const empty=(title,body)=>`<div class="empty"><b>${title}</b>${body||""}</div>`;
function dlRow(t,showClient){const [cd,cls]=t.done?["Done",""]:countdown(t.date);
  return `<div class="row"><input type="checkbox" class="chk" data-act="toggle" data-id="${t.id}" ${t.done?"checked":""} aria-label="Mark ${esc(t.title)} done">

  const attHtml=attention.length?`<div class="list">${attention.map(a=>{
    if(a.kind==="late")return dlRow(a.t,true).replace('<div class="row">','<div class="row att">');
    const f=freshness(a.c);
    return `<div class="row att"><span class="ic warn" aria-hidden="true">◷</span><div class="grow"><div class="t">${esc(a.c.name)}</div>
    <div class="sub">${f.days===null?"Never checked":"Last checked "+f.days+" days ago"} · you check it ${esc(EVERY[a.c.every]||"every week")}</div></div>
    <button class="btn sm" data-act="new-note" data-cid="${a.c.id}">Add note</button></div>`}).join("")}</div>`:empty("All clear","Nothing late, and every client has been checked on time.");

  const withLate=S.week===0;
  const cells=(withLate?[{k:"late",dn:"Late",dd:lt.length,items:lt,late:true}]:[]).concat(days.map(s=>({k:s,dn:s===t0?"Today":DAY[toD(s).getDay()],dd:toD(s).getDate(),items:o.filter(t=>t.date===s),today:s===t0})));
  const label=S.week===0?"This week":S.week===1?"Next week":S.week===-1?"Last week":fmt(days[0])+" – "+fmt(days[6]);
  const sel=S.day&&cells.find(c=>c.k===S.day);
  let wl;
  if(sel)wl=`<div class="list">${sel.items.map(t=>dlRow(t,true)).join("")||empty("Nothing due","")}</div>`;
  else{const groups=days.map(s=>[s,o.filter(t=>t.date===s)]).filter(([,ts])=>ts.length);
    wl=groups.length?`<div class="list">${groups.map(([s,ts])=>`<div class="dayhead ${s===t0?"today":""}"><span>${s===t0?"Today":DAY[toD(s).getDay()]+" "+fmt(s)}</span><span>${ts.length}</span></div>${ts.map(t=>dlRow(t,true)).join("")}`).join("")}</div>`

  const feed=S.updates.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,8);

  <div class="stats"><span class="stat ${lt.length?"bad":""}"><b>${lt.length}</b> late</span><span class="stat"><b>${o.filter(t=>t.date===t0).length}</b> due today</span><span class="stat ${st.length?"bad":""}"><b>${st.length}</b> not checked</span></div></div>
  ${composer("")}

    <div class="panel"><div class="panel-h"><h2>Needs your attention</h2><span class="chip ${attention.length?"bad":"ok"}">${attention.length||"0"}</span></div>${attHtml}</div>
    <div class="panel"><div class="panel-h weekbar"><h2>${label}</h2><span style="display:flex;gap:4px">
      <button class="icon-btn" data-act="week" data-d="-1" aria-label="Previous week">‹</button>${S.week?`<button class="btn sm ghost" data-act="week" data-d="0">Today</button>`:""}<button class="icon-btn" data-act="week" data-d="1" aria-label="Next week">›</button></span></div>
      <div style="padding:12px 16px;border-bottom:1px solid var(--line)"><div class="week ${withLate?"with-late":""}">${cells.map(x=>`<button class="day ${x.late?"late":""} ${x.today?"today":""} ${S.day===x.k?"on":""}" data-act="day" data-k="${x.k}" aria-pressed="${S.day===x.k}">
        <span class="dn"><span>${x.dn}</span>${x.late?"":`<span>${x.items.length||""}</span>`}</span><span class="dd">${x.dd}</span>
        <span class="bars">${x.items.slice(0,5).map(t=>`<i style="background:var(${(TYPES[t.type]||TYPES.other)[1]})"></i>`).join("")}</span></button>`).join("")}</div>

      <div class="list">${o.map(t=>dlRow(t,false)).join("")||empty("Nothing due","")}</div>
      ${done.length?`<details style="padding:8px 16px;border-top:1px solid var(--line)"><summary class="muted" style="cursor:pointer;font-size:13px">${done.length} done</summary><div class="list">${done.map(t=>dlRow(t,false)).join("")}</div></details>`:""}</div>
    <div class="panel"><div class="panel-h"><h2>Sheets &amp; reports</h2><button class="btn sm ghost" data-act="new-link" data-cid="${c.id}">+ Add</button></div>
      <div class="list">${links.map(l=>linkRow(l,false)).join("")||empty("No links yet","")}</div></div>
    <div class="panel"><div class="panel-h"><h2>Logins</h2><button class="btn sm ghost" data-act="new-login" data-cid="${c.id}">+ Add</button></div>
      <div class="list">${logins.map(g=>loginRow(g,false)).join("")||empty("No logins yet","")}</div></div>
  </div></div>`}
function vLinks(){
  const gs=agencyGroups().flatMap(a=>a.clients).map(c=>[c,S.links.filter(l=>l.clientId===c.id)]).filter(([,ls])=>ls.length);
  return `<div class="ch"><div><h1>Links</h1><p class="lead">${S.links.length} sheets, reports and folders. Type a client name in search to see only theirs.</p></div><button class="btn pri" data-act="new-link">+ Link</button></div>
  ${gs.map(([c,ls])=>`<div class="panel"><div class="panel-h"><h2><button class="back" style="color:var(--ink)" data-act="client" data-id="${c.id}">${esc(c.name)}</button> <span class="muted" style="font:400 13px var(--f-body)">${esc(agencyName(c.agencyId))}</span></h2><button class="btn sm ghost" data-act="new-link" data-cid="${c.id}">+ Add</button></div><div class="list">${ls.map(l=>linkRow(l,false)).join("")}</div></div>`).join("")
    ||`<div class="panel">${empty("No links yet",`<div style="margin-top:8px"><button class="btn sm pri" data-act="new-link">+ Add your first link</button></div>`)}</div>`}`}
function vLogins(){
  const gs=[["General","Not tied to one client",S.logins.filter(g=>!g.clientId),""]].concat(agencyGroups().flatMap(a=>a.clients).map(c=>[c.name,agencyName(c.agencyId),S.logins.filter(g=>g.clientId===c.id),c.id])).filter(x=>x[2].length);
  return `<div class="ch"><div><h1>Logins</h1><p class="lead">${S.logins.length} email IDs and passwords. Tap Copy to grab one.</p></div><button class="btn pri" data-act="new-login">+ Login</button></div>
  ${gs.map(([n,sub,ls,cid])=>`<div class="panel"><div class="panel-h"><h2>${esc(n)} <span class="muted" style="font:400 13px var(--f-body)">${esc(sub)}</span></h2><button class="btn sm ghost" data-act="new-login" data-cid="${cid}">+ Add</button></div><div class="list">${ls.map(g=>loginRow(g,false)).join("")}</div></div>`).join("")
    ||`<div class="panel">${empty("No logins yet","")}</div>`}`}
function vSearch(){
  const q=S.q.toLowerCase(),ags=S.agencies.filter(a=>a.name.toLowerCase().includes(q)).map(a=>a.id);
  const cs=sortedClients().filter(c=>c.name.toLowerCase().includes(q)||ags.includes(c.agencyId));const ids=new Set(cs.map(c=>c.id));
  const oU=S.updates.filter(u=>!ids.has(u.clientId)&&u.text.toLowerCase().includes(q));
  const oD=open().filter(t=>!ids.has(t.clientId)&&t.title.toLowerCase().includes(q));
  const oG=S.logins.filter(g=>!ids.has(g.clientId)&&(g.user||"").toLowerCase().includes(q));
  const oL=S.links.filter(l=>!ids.has(l.clientId)&&((l.label||"")+" "+l.url).toLowerCase().includes(q));
  const total=cs.length+oU.length+oD.length+oG.length+oL.length;
  return `<div class="ch"><div><h1>Search</h1><p class="lead">${total} ${total===1?"result":"results"} for “${esc(S.q)}”</p></div><button class="btn" data-act="clear-search">Clear</button></div>
  ${cs.map(c=>{const f=freshness(c),ls=S.links.filter(l=>l.clientId===c.id),gs=S.logins.filter(g=>g.clientId===c.id),us=updatesOf(c.id).slice(0,2);
    return `<div class="result"><div class="panel-h"><div><h2>${hl(c.name)}</h2><span class="muted" style="font-size:13px">${esc(agencyName(c.agencyId))} · ${f.days===null?"never checked":"checked "+agoShort(f.days)+(f.days?" ago":"")}</span></div><button class="btn sm pri" data-act="client" data-id="${c.id}">Open</button></div>
    <div class="list">${ls.map(l=>linkRow(l,false)).join("")}${gs.map(g=>loginRow(g,false)).join("")}${us.map(u=>noteItem(u,false)).join("")}${!ls.length&&!gs.length&&!us.length?empty("Nothing saved for this client yet",""):""}</div></div>`}).join("")}
  ${oU.length?`<div class="panel"><div class="panel-h"><h2>Notes</h2></div><div class="list">${oU.map(u=>noteItem(u,true)).join("")}</div></div>`:""}
  ${oD.length?`<div class="panel"><div class="panel-h"><h2>Deadlines</h2></div><div class="list">${oD.map(t=>dlRow(t,true)).join("")}</div></div>`:""}
  ${oL.length?`<div class="panel"><div class="panel-h"><h2>Links</h2></div><div class="list">${oL.map(l=>linkRow(l,true)).join("")}</div></div>`:""}
  ${oG.length?`<div class="panel"><div class="panel-h"><h2>Logins</h2></div><div class="list">${oG.map(g=>loginRow(g,true)).join("")}</div></div>`:""}
  ${!total?`<div class="panel">${empty("No matches","Try a client name, part of an email, or a word from a note.")}</div>`:""}`}

function render(){
  const cur=S.q?"":S.view==="client"?"clients":S.view,lt=late().length;
  const items=[["today","Today",lt?`<span class="n bad">${lt}</span>`:""],["clients","Clients",`<span class="n">${S.clients.length}</span>`],["links","Links",`<span class="n">${S.links.length}</span>`],["logins","Logins",`<span class="n">${S.logins.length}</span>`]];
  document.getElementById("side").innerHTML=`<div class="brand"><span class="logo">H</span><span><b>Harsha</b><small>Client tracker</small></span></div>
  <nav class="nav" aria-label="Sections">${items.map(([k,l,n])=>`<button class="nb ${cur===k?"on":""}" data-act="nav" data-v="${k}" ${cur===k?'aria-current="page"':""}>${ICON[k]}${l}${n}</button>`).join("")}</nav>
  <div class="tree"><div class="tree-h"><span>Your clients</span><button class="icon-btn" data-act="new-client" aria-label="Add client">+</button></div>
  ${agencyGroups().filter(a=>a.clients.length).map(a=>`<div class="ag"><div class="ag-n">${esc(a.name)}</div>${a.clients.map(c=>{const f=freshness(c);
    return `<button class="cb ${S.view==="client"&&S.clientId===c.id&&!S.q?"on":""}" data-act="client" data-id="${c.id}"><span class="dot ${f.cls}"></span><span class="nm">${esc(c.name)}</span><span class="ago ${f.cls==="ok"?"":f.cls}">${agoShort(f.days)}</span></button>`}).join("")}</div>`).join("")}</div>`;
  document.getElementById("tabbar").innerHTML=items.map(([k,l])=>`<button class="${cur===k?"on":""}" data-act="nav" data-v="${k}">${ICON[k]}${l}</button>`).join("");
  document.getElementById("view").innerHTML=S.q?vSearch():S.view==="clients"?vClients():S.view==="client"?vClient():S.view==="links"?vLinks():S.view==="logins"?vLogins():vToday()}

/* ---------- modals ---------- */
let M=null;
function modal(title,body,form,{del}={}){
  document.getElementById("modal").innerHTML=`<div class="overlay" data-act="close-bg"><form class="modal" data-form="${form}" autocomplete="off" role="dialog" aria-modal="true" aria-label="${esc(title)}">
  <div class="modal-h"><h2 style="font-size:20px">${esc(title)}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">✕</button></div>${body}
  <div class="foot"><span>${del||""}</span><span style="display:flex;gap:8px"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Save</button></span></div></form></div>`;
  setTimeout(()=>{const x=document.querySelector("#modal [data-autofocus]")||document.querySelector("#modal textarea, #modal input:not([type=radio]):not([type=checkbox]), #modal select");x&&x.focus()},20)}
function closeModal(){M=null;document.getElementById("modal").innerHTML=""}
const delInModal=(k,id,label)=>`<button type="button" class="btn ghost" style="color:var(--bad)" data-act="del" data-k="${k}" data-id="${id}">Delete ${label}</button>`;
function noteForm(u){M={k:"updates",id:u.id||null};
  modal(u.id?"Edit note":"New note",`<div class="f"><label for="f-client">Client</label><select class="field" id="f-client" name="clientId" required>${clientOptions(u.clientId)}</select></div>
  <div class="f"><span class="fl">Type</span><div class="pick">${Object.entries(KINDS).map(([k,l])=>`<label><input type="radio" name="kind" value="${k}" ${k===(u.kind||"note")?"checked":""}>${l}</label>`).join("")}</div></div>
  <div class="f"><label for="f-text">Note</label><textarea class="field" id="f-text" name="text" required ${u.clientId?"data-autofocus":""} placeholder="What you changed, what was said, anything to remember">${esc(u.text||"")}</textarea></div>
  <div class="f" style="max-width:200px"><label for="f-date">Date</label><input class="field" id="f-date" type="date" name="date" value="${esc(u.date||t0)}"></div>`,"note-modal",{del:u.id?delInModal("updates",u.id,"note"):""})}
function deadlineForm(t){M={k:"deadlines",id:t.id||null};
  modal(t.id?"Edit deadline":"New deadline",`<div class="f"><label for="f-title">What's due</label><input class="field" id="f-title" name="title" required value="${esc(t.title||"")}" placeholder="Monthly report, campaign launch, creatives…"></div>
  <div class="fr"><div class="f"><label for="f-client">Client</label><select class="field" id="f-client" name="clientId" required>${clientOptions(t.clientId)}</select></div>
  <div class="f"><label for="f-date">Due date</label><input class="field" id="f-date" type="date" name="date" value="${esc(t.date||t0)}"></div></div>
  <div class="f"><span class="fl">Type</span><div class="pick">${Object.entries(TYPES).map(([k,[l,v]])=>`<label><input type="radio" name="type" value="${k}" ${k===(t.type||"report")?"checked":""}><i style="background:var(${v})"></i>${l}</label>`).join("")}</div></div>
  <div class="f"><span class="fl">Repeats</span><div class="pick">${Object.entries(REPEAT).map(([k,l])=>`<label><input type="radio" name="repeat" value="${k}" ${k===(t.repeat||"")?"checked":""}>${l}</label>`).join("")}</div>
  <span class="hint">A repeating deadline adds the next one when you tick it off.</span></div>`,"deadline",{del:t.id?delInModal("deadlines",t.id,"deadline"):""})}
function clientForm(c){M={k:"clients",id:c.id||null};
  modal(c.id?"Edit client":"New client",`<div class="f"><label for="f-name">Client / brand name</label><input class="field" id="f-name" name="name" required value="${esc(c.name||"")}"></div>
  <div class="fr"><div class="f"><label for="f-ag">Agency</label><select class="field" id="f-ag" name="agencyId"><option value="">Direct client</option>${S.agencies.map(a=>`<option value="${a.id}" ${a.id===c.agencyId?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
  <div class="f"><label for="f-every">Remind me to check it</label><select class="field" id="f-every" name="every">${Object.entries(EVERY).map(([k,l])=>`<option value="${k}" ${+k===(c.every||7)?"selected":""}>${l[0].toUpperCase()+l.slice(1)}</option>`).join("")}</select></div></div>
  <div class="f"><span class="fl">Platforms you run</span><div class="pick">${PLATFORMS.map(p=>`<label><input type="checkbox" name="platforms" value="${esc(p)}" ${(c.platforms||[]).includes(p)?"checked":""}>${esc(p)}</label>`).join("")}</div></div>`,"client",{del:c.id?delInModal("clients",c.id,"client"):""})}
function agencyForm(a){M={k:"agencies",id:a.id||null};
  modal(a.id?"Rename agency":"New agency",`<div class="f"><label for="f-name">Agency name</label><input class="field" id="f-name" name="name" required value="${esc(a.name||"")}" placeholder="MGC"></div>`,"agency")}
function linkForm(l){M={k:"links",id:l.id||null};
  modal(l.id?"Edit link":"New link",`<div class="f"><label for="f-url">Link</label><input class="field" id="f-url" name="url" required value="${esc(l.url||"")}" placeholder="Paste a Google Sheet, Looker report or Drive link" ${l.clientId?"data-autofocus":""}></div>
  <div class="f"><label for="f-label">Name</label><input class="field" id="f-label" name="label" value="${esc(l.label||"")}" placeholder="Weekly report"></div>
  <div class="f"><label for="f-client">Client</label><select class="field" id="f-client" name="clientId" required>${clientOptions(l.clientId)}</select></div>`,"link",{del:l.id?delInModal("links",l.id,"link"):""})}
function loginForm(g){M={k:"logins",id:g.id||null};
  modal(g.id?"Edit login":"New login",`<div class="f"><label for="f-user">Email ID</label><input class="field" id="f-user" name="user" required value="${esc(g.user||"")}" placeholder="name@brand.com" data-autofocus></div>
  <div class="f"><label for="f-pw">Password</label><input class="field" id="f-pw" name="pw" value="${esc(g.pw||"")}"></div>
  <div class="f"><label for="f-client">Client</label><select class="field" id="f-client" name="clientId">${clientOptions(g.clientId,"General (not one client)")}</select></div>`,"login",{del:g.id?delInModal("logins",g.id,"login"):""})}

/* ---------- toast with undo ---------- */
let undoSnap=null,toastT=null;
function toast(msg,undo){const el=document.getElementById("toast");undoSnap=undo||null;
  el.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button data-act="undo">Undo</button>`:""}</div>`;
  clearTimeout(toastT);toastT=setTimeout(()=>{el.innerHTML="";undoSnap=null},undo?6000:2400)}
const snapshot=()=>JSON.parse(JSON.stringify({agencies:S.agencies,clients:S.clients,updates:S.updates,deadlines:S.deadlines,links:S.links,logins:S.logins}));

/* ---------- events ---------- */
const q=document.getElementById("q");
q.addEventListener("input",()=>{S.q=q.value.trim();render()});
function go(v,id){S.view=v;S.clientId=id||null;S.q="";q.value="";if(v!=="client")S.filter="all";closeModal();render();window.scrollTo(0,0)}
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const fd=new FormData(f),g=k=>String(fd.get(k)??"").trim(),kind=f.dataset.form;
  const upsert=(k,data,msg)=>{const ex=M&&M.id&&byId(S[k],M.id);if(ex)Object.assign(ex,data);else S[k].push({id:newId(),...data});closeModal();toast(ex?"Saved":msg);return ex};
  if(kind==="note"){const cid=f.dataset.cid||g("clientId");S.updates.push({id:newId(),clientId:cid,kind:g("kind")||"note",date:t0,text:g("text")});toast("Note saved to "+clientName(cid));}
  if(kind==="note-modal")upsert("updates",{clientId:g("clientId"),kind:g("kind")||"note",text:g("text"),date:g("date")||t0},"Note saved to "+clientName(g("clientId")));
  if(kind==="deadline")upsert("deadlines",{title:g("title"),clientId:g("clientId"),date:g("date"),type:g("type")||"other",repeat:g("repeat"),done:M&&M.id?byId(S.deadlines,M.id).done:false},"Deadline added");
  if(kind==="client"){const data={name:g("name"),agencyId:g("agencyId"),every:+g("every")||7,platforms:fd.getAll("platforms")};
    if(M&&M.id){upsert("clients",data,"")}else{const id=newId();S.clients.push({id,...data});closeModal();go("client",id);toast("Client added. Add a note, link or login below.");return}}
  if(kind==="agency")upsert("agencies",{name:g("name")},"Agency added");
  if(kind==="link")upsert("links",{url:safeUrl(g("url")),label:g("label"),clientId:g("clientId")},"Link added");
  if(kind==="login")upsert("logins",{user:g("user"),pw:String(fd.get("pw")??""),clientId:g("clientId")},"Login saved");
  render();
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,ds=el.dataset;
  const here=S.view==="client"?S.clientId:"";
  if(a==="close-bg"){if(e.target===el)closeModal();return}
  if(a==="close")closeModal();
  else if(a==="nav"){S.day=null;go(ds.v)}
  else if(a==="client")go("client",ds.id);
  else if(a==="clear-search"){S.q="";q.value="";render()}
  else if(a==="day"){S.day=S.day===ds.k?null:ds.k;render()}
  else if(a==="week"){S.week=+ds.d===0?0:S.week+(+ds.d);S.day=null;render()}
  else if(a==="filter"){S.filter=ds.k;render()}
  else if(a==="new-note")noteForm({clientId:ds.cid||here});
  else if(a==="edit-note")noteForm(byId(S.updates,ds.id));
  else if(a==="new-deadline")deadlineForm({clientId:ds.cid||here});
  else if(a==="edit-deadline")deadlineForm(byId(S.deadlines,ds.id));
  else if(a==="new-client")clientForm({agencyId:ds.agency||""});
  else if(a==="edit-client")clientForm(byId(S.clients,ds.id));
  else if(a==="new-agency")agencyForm({});
  else if(a==="edit-agency")agencyForm(byId(S.agencies,ds.id));
  else if(a==="new-link")linkForm({clientId:ds.cid??here});
  else if(a==="edit-link")linkForm(byId(S.links,ds.id));
  else if(a==="new-login")loginForm({clientId:ds.cid??here});
  else if(a==="edit-login")loginForm(byId(S.logins,ds.id));
  else if(a==="toggle"){const t=byId(S.deadlines,ds.id);const snap=snapshot();t.done=!t.done;
    if(t.done&&t.repeat&&!t.spawned&&t.date){const next=t.repeat==="weekly"?addDays(t.date,7):addMonth(t.date);t.spawned=true;
      S.deadlines.push({id:newId(),clientId:t.clientId,title:t.title,type:t.type,repeat:t.repeat,date:next,done:false});toast("Done. Next one is on "+fmt(next),snap)}
    else toast(t.done?"Marked done":"Marked not done",t.done?snap:null);render()}
  else if(a==="copy"){try{await navigator.clipboard.writeText(ds.text);toast("Copied")}catch(_){toast("Couldn't copy. Select the text instead.")}}
  else if(a==="del"){const k=ds.k,id=ds.id,snap=snapshot();const name={updates:"Note",deadlines:"Deadline",links:"Link",logins:"Login",clients:"Client",agencies:"Agency"}[k];
    S[k]=S[k].filter(x=>x.id!==id);
    if(k==="clients"){for(const c of ["deadlines","updates","links","logins"])S[c]=S[c].filter(x=>x.clientId!==id)}
    if(k==="agencies")S.clients.forEach(c=>{if(c.agencyId===id)c.agencyId=""});
    closeModal();if(k==="clients"&&S.clientId===id){S.view="clients";S.clientId=null}
    toast(name+" deleted",snap);render()}
  else if(a==="undo"&&undoSnap){Object.assign(S,undoSnap);undoSnap=null;document.getElementById("toast").innerHTML="";render()}
});
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if(e.key==="Escape"){if(M||document.querySelector("#modal .overlay"))closeModal();else if(S.q){S.q="";q.value="";render()}else if(typing)document.activeElement.blur()}
  else if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){const f=document.activeElement?.closest("form");if(f){e.preventDefault();f.requestSubmit()}}
  else if(!typing&&!document.querySelector("#modal .overlay")){
    if(e.key==="/"){e.preventDefault();q.focus()}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();noteForm({clientId:S.view==="client"?S.clientId:""})}}
});
render();
</script>
</body>
</html>
