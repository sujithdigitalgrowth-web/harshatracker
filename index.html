<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harsha Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: capture first (a note box where you land), then "needs attention", then the week; sidebar mirrors agency → client. White, blue accent. */
:root{color-scheme:light;
  --bg:#FFFFFF;--soft:#F5F7FA;--soft2:#EEF1F6;--ink:#141A24;--muted:#626C7C;--line:#E3E7EE;
  --accent:#2459C9;--accent-ink:#FFFFFF;--accent-soft:#E8EEFC;--accent-line:#BFD0F5;
  --bad:#C0352B;--bad-soft:#FDECEA;--warn:#9A6211;--warn-soft:#FCF2DE;--ok:#2E7D4F;--ok-soft:#E5F3EA;
  --k-note:#2459C9;--k-note-soft:#E8EEFC;--k-change:#B4531F;--k-change-soft:#FCEBDF;--k-call:#6A4FC0;--k-call-soft:#EFEAFB;
  --t-report:#4A3FB0;--t-launch:#0E7490;--t-creative:#A2458F;--t-budget:#9A6211;--t-optim:#4F6B78;--t-call:#6A4FC0;--t-other:#8A93A3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.preview{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500;text-align:center;padding:5px 16px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 28px)}

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--line);padding:20px 12px 24px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 16px var(--f-display);flex:none}
.brand b{font:700 17px/1.1 var(--f-display);display:block}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink)}
.nb svg{flex:none;color:var(--muted)}
.nb:hover{background:var(--soft)}
.nb.on{background:var(--accent-soft);color:var(--accent)}
.nb.on svg{color:var(--accent)}
.nb .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.nb .n.bad{color:#fff;background:var(--bad);border-radius:99px;padding:0 7px}
.nb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tree{display:flex;flex-direction:column;gap:12px}
.tree-h{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.tree-h span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ag{display:flex;flex-direction:column;gap:1px}
.ag-n{font-size:12px;color:var(--muted);padding:2px 10px;font-weight:500}
.cb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 18px;border-radius:7px;cursor:pointer;font-size:14px}
.cb:hover{background:var(--soft)}
.cb.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.cb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .ago{font:500 11px var(--f-mono);color:var(--muted)}
.cb .ago.bad{color:var(--bad)}.cb .ago.warn{color:var(--warn)}
.cb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- top bar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 32px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.94);backdrop-filter:blur(6px);z-index:5}
.search{position:relative;display:block;flex:1 1 240px;max-width:520px}
.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 40px 9px 38px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--bg)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.kbd{font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.top .sp{flex:1}
.view{padding:28px 32px 96px;display:flex;flex-direction:column;gap:28px;max-width:1180px;width:100%}

/* ---------- type ---------- */
h1{font:700 30px/1.15 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:600 17px/1.3 var(--f-display);margin:0}
.lead{color:var(--muted);margin:6px 0 0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:30px}
.btn.ghost{border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.icon-btn{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.icon-btn:hover{background:var(--soft2);color:var(--ink)}
.icon-btn.danger:hover{color:var(--bad);background:var(--bad-soft)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;min-width:0;width:100%}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.field{resize:vertical;min-height:84px}

/* ---------- panels & lists ---------- */
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.list > *+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .t.done{text-decoration:line-through;color:var(--muted);font-weight:400}
.row .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.row:hover .acts,.row:focus-within .acts,.note:hover .acts,.note:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.empty{color:var(--muted);font-size:14px;padding:18px 16px;text-align:center}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;background:var(--soft2);color:var(--muted);white-space:nowrap;border:0}
.chip.c{background:var(--accent-soft);color:var(--accent);cursor:pointer}
.chip.c:hover{background:var(--accent-line)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
.kind{display:inline-flex;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.kind.note{background:var(--k-note-soft);color:var(--k-note)}.kind.change{background:var(--k-change-soft);color:var(--k-change)}.kind.call{background:var(--k-call-soft);color:var(--k-call)}
.type{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.type i{width:8px;height:8px;border-radius:2px}
.due{font:500 13px var(--f-mono);white-space:nowrap}
.due.bad{color:var(--bad)}.due.warn{color:var(--warn)}

/* ---------- composer ---------- */
.composer{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.composer:focus-within{border-color:var(--accent-line);background:var(--bg);box-shadow:0 0 0 4px var(--accent-soft)}
.composer textarea{border:0;background:transparent;resize:none;min-height:52px;padding:4px 4px;width:100%;outline:none;font-size:15px}
.composer .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.composer select{width:auto;max-width:220px;padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.hint{font-size:12px;color:var(--muted)}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:99px;background:var(--soft);font-size:13px;color:var(--muted)}
.stat b{font:600 15px var(--f-mono);color:var(--ink)}
.stat.bad{background:var(--bad-soft);color:var(--bad)}.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.att .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}
.att .ic.bad{background:var(--bad-soft);color:var(--bad)}.att .ic.warn{background:var(--warn-soft);color:var(--warn)}
.weekbar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week.with-late{grid-template-columns:repeat(8,minmax(0,1fr))}
.day{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.day:hover{border-color:var(--accent-line)}
.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.day .dd{font:600 17px/1 var(--f-mono)}
.day.today{background:var(--accent-soft);border-color:transparent}
.day.today .dn,.day.today .dd{color:var(--accent)}
.day.late{background:var(--bad-soft);border-color:transparent}
.day.late .dn,.day.late .dd{color:var(--bad)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bars{display:flex;gap:3px;flex-wrap:wrap;min-height:5px}
.bars i{width:12px;height:5px;border-radius:3px}
.dayhead{padding:8px 16px;background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.dayhead.today{color:var(--accent)}
.feed .note{padding:12px 16px}

/* ---------- notes ---------- */
.note{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.note .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.note .hd .acts{margin-left:auto}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.feed .note p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ftabs{display:flex;gap:4px;flex-wrap:wrap}
.ftab{all:unset;cursor:pointer;font-size:13px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.ftab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ftab:focus-visible{outline:2px solid var(--accent)}

/* ---------- clients ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--accent-line);box-shadow:0 4px 18px rgba(36,89,201,.08)}
.card:focus-visible{outline:2px solid var(--accent)}
.card .nm{font:600 17px var(--f-display)}
.card .ln{font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .ln span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card .ln span:last-child{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .ft{display:flex;gap:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}

/* ---------- client page ---------- */
.back{all:unset;cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.lk{min-width:0;display:flex;flex-direction:column}
.lk a{font-weight:500;text-decoration:none;overflow-wrap:anywhere;color:var(--ink)}
.lk a:hover{color:var(--accent);text-decoration:underline}
.lk small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;font:600 11px var(--f-mono);color:#fff}
.cred{display:flex;align-items:center;gap:6px;min-width:0}
.cred .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:38px;flex:none}
.cred .v{font:400 13px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.login{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:11px 16px}
.login .who{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:500}
.copy{all:unset;cursor:pointer;font-size:12px;color:var(--accent);padding:2px 6px;border-radius:5px;flex:none}
.copy:hover{background:var(--accent-soft)}
.copy:focus-visible{outline:2px solid var(--accent)}
.result{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.result .panel-h{background:var(--soft)}
mark{background:#FFF0A8;color:inherit;border-radius:2px;padding:0 1px}

/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.38);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;z-index:20;overflow:auto}
.modal{background:var(--bg);border-radius:16px;width:100%;max-width:520px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 70px rgba(16,24,40,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.f > .fl{font-size:13px;color:var(--muted);font-weight:500}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.pick label:has(input:focus-visible){outline:2px solid var(--accent)}
.pick i{width:8px;height:8px;border-radius:2px}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:30;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast button{all:unset;cursor:pointer;color:#9DB8F5;font-weight:600;padding:4px 10px;border-radius:7px}
.toast button:hover{background:rgba(255,255,255,.1)}
.toast span:only-child{padding-right:8px}

/* ---------- note box: Deadline option ---------- */
.composer .dl-only{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.composer:has(input[name="kind"][value="deadline"]:checked) .dl-only{display:inline-flex}
.composer:has(input[name="kind"][value="deadline"]:checked) .note-only{display:none}
.composer .dl-only label{font-size:13px;color:var(--muted)}
.composer .dl-only .field{width:auto;padding:6px 10px}
.seg label.dl-opt:has(input:checked){background:var(--accent);color:#fff}

/* ---------- deadlines page ---------- */
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--soft)}
.quick:focus-within{border-color:var(--accent-line);background:var(--bg);box-shadow:0 0 0 4px var(--accent-soft)}
.quick .field{width:auto}
.quick .t-in{flex:1 1 260px}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--soft2);color:var(--muted)}
.pri::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pri.high{background:var(--bad-soft);color:var(--bad)}.pri.medium{background:var(--warn-soft);color:var(--warn)}.pri.low{background:var(--soft2);color:var(--muted)}
.row.dl{align-items:flex-start}
.row.dl .chk{margin-top:2px}
.row.dl .line1{display:flex;gap:8px;align-items:flex-start}
.row.dl .line1 .t{flex:1;min-width:0}
.row.dl .line1 .acts{flex:none;margin-top:-4px}
.row.dl .sub{margin-top:6px;gap:8px}
.row.dl .due{font:500 13px var(--f-body);display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.row.dl .due.bad{color:var(--bad)}.row.dl .due.warn{color:var(--warn)}
.row.dl .sep{color:var(--line)}
.dl-acts{margin-left:auto;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn.done-btn{color:var(--ok);border-color:#BFE0CB}
.btn.done-btn:hover{background:var(--ok-soft)}
.btn.ext-btn{color:var(--muted)}
.pri-h.high{color:var(--bad)}.pri-h.medium{color:var(--warn)}

/* ---------- login & save status ---------- */
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--soft)}
.login-card{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:32px 28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(16,24,40,.08)}
.login-card .logo{width:44px;height:44px;font-size:20px;border-radius:12px}
.login-card h1{font-size:24px}
.login-card .btn{justify-content:center;min-height:44px}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save.error{color:var(--bad)}
.save button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.signout{all:unset;cursor:pointer;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:7px;margin-top:auto}
.signout:hover{background:var(--soft);color:var(--ink)}
.welcome{border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.welcome ol{margin:0;padding-left:20px;color:var(--ink);display:flex;flex-direction:column;gap:4px}

/* ---------- phone ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .top .kbd,.top .hide-sm{display:none}
  .view{padding:20px 16px 110px;gap:22px}
  .cols{grid-template-columns:1fr}
  .week,.week.with-late{grid-template-columns:repeat(4,minmax(0,1fr))}
  h1{font-size:26px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
  .tabbar button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:8px;cursor:pointer}
  .tabbar button.on{color:var(--accent)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){.fr{grid-template-columns:1fr}.login{grid-template-columns:1fr}.composer select{max-width:100%;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="login-screen" id="login" hidden>
  <form class="login-card" data-form="signin" autocomplete="on">
    <span class="logo">H</span>
    <div><h1>Harsha Tracker</h1><p class="lead" id="login-msg">Sign in to see your clients.</p></div>
    <div class="f"><label for="pw">Password</label><input class="field" id="pw" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn pri">Sign in</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>
</div>
<div class="preview" id="banner" hidden>Preview with sample data. Nothing is saved.</div>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="top">
      <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search clients, notes, links, emails" aria-label="Search" autocomplete="off"><span class="kbd">/</span></label>
      <span class="sp"></span><span class="save" id="save" aria-live="polite"></span>
      <button class="btn hide-sm" data-act="new-deadline">+ Deadline</button>
      <button class="btn pri" data-act="new-note">+ Note <span class="kbd hide-sm" style="background:transparent;color:#DCE6FB;border-color:rgba(255,255,255,.35)">N</span></button>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ---------- constants ---------- */
const TYPES={report:["Report","--t-report"],launch:["Launch","--t-launch"],creative:["Creatives","--t-creative"],budget:["Budget","--t-budget"],
  optim:["Optimisation","--t-optim"],call:["Call","--t-call"],other:["Other","--t-other"]};
const KINDS={note:"Note",change:"Change",call:"Call"};
const EVERY={"1":"every day","2":"every 2 days","3":"every 3 days","7":"every week","14":"every 2 weeks","30":"every month"};
const PLATFORMS=["Google Ads","Meta","GA4","Shopify","Amazon","LinkedIn"];
const REPEAT={"":"Doesn't repeat",weekly:"Every week",monthly:"Every month"};
const PRI={high:"High",medium:"Medium",low:"Low"},PRI_RANK={high:0,medium:1,low:2};
const ICON={
  today:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3.5" width="13" height="12" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 7.5h13M6 2v3M12 2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  clients:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="7" cy="6.5" r="2.8" stroke="currentColor" stroke-width="1.5"/><path d="M2 15c.6-2.6 2.6-4 5-4s4.4 1.4 5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 4a2.5 2.5 0 010 5M13.5 11.3c1.3.5 2.2 1.7 2.5 3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  links:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7.5 10.5l3-3M6 8.5L4.6 9.9a2.8 2.8 0 004 4L10 12.5M12 9.5l1.4-1.4a2.8 2.8 0 00-4-4L8 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  logins:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="8" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8V6a3.5 3.5 0 017 0v2" stroke="currentColor" stroke-width="1.5"/></svg>'};

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl=s=>{const t=esc(s);if(!S.q)return t;const q=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp("("+q+")","ig"),"<mark>$1</mark>")};
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toD=s=>new Date(s+"T00:00");
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return dstr(d)};
const addMonth=s=>{const d=toD(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dstr(d)};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt=s=>{if(!s)return"";const d=toD(s);return d.getDate()+" "+MON[d.getMonth()]};
let t0=dstr(new Date());
const diff=s=>Math.round((toD(s)-toD(t0))/864e5);
const ago=s=>{const n=-diff(s);return n<0?"on "+fmt(s):n===0?"today":n===1?"yesterday":n+" days ago"};
const agoShort=n=>n===null?"never":n===0?"today":n+"d";
function countdown(s){if(!s)return["No date",""];const n=diff(s);if(n<0)return[(-n)+"d late","bad"];if(n===0)return["Today","warn"];if(n===1)return["Tomorrow","warn"];return["in "+n+"d",""]}
const safeUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(_){return u}};
const byId=(a,id)=>a.find(x=>x.id===id);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const d=n=>addDays(t0,n);

/* ---------- state ---------- */
const S={view:"today",clientId:null,q:"",day:null,week:0,filter:"all",sort:"priority",
  agencies:[],clients:[],updates:[],deadlines:[],links:[],logins:[]};
/* shown only when the page runs without its server (e.g. the claude.ai preview) */
const sampleData=()=>({
  agencies:[{id:"a1",name:"MGC"},{id:"a2",name:"Northwind Media"}],
  clients:[
    {id:"c1",agencyId:"a1",name:"Kaveri Foods",platforms:["Google Ads","Meta"],every:3},
    {id:"c2",agencyId:"a1",name:"Luma Skincare",platforms:["Meta","Shopify"],every:3},
    {id:"c3",agencyId:"a1",name:"Trekline Outdoors",platforms:["Google Ads"],every:7},
    {id:"c4",agencyId:"a2",name:"Sona Jewels",platforms:["Google Ads","Meta","GA4"],every:7},
    {id:"c5",agencyId:"",name:"Bloom Café",platforms:["Meta"],every:30}],
  updates:[
    {id:"u1",clientId:"c1",kind:"change",date:d(-3),text:"Raised Search budget 20% (₹8k → ₹9.6k/day).\nMoved 'masala combo' and 'ready to cook' to exact match."},
    {id:"u2",clientId:"c1",kind:"note",date:d(-1),text:"Spends and CPCs normal. Diwali creatives still pending from client."},
    {id:"u3",clientId:"c1",kind:"call",date:d(-6),text:"Weekly call with Anil. Budget up to ₹2.5L/month. Wants daily spend update on WhatsApp."},
    {id:"u4",clientId:"c2",kind:"change",date:d(-5),text:"Paused 3 low-ROAS ad sets. Launched new 2% lookalike on purchasers."},
    {id:"u5",clientId:"c2",kind:"call",date:d(-9),text:"Monthly call with Priya. CPA target ₹450. Cut brand search spend."},
    {id:"u6",clientId:"c3",kind:"note",date:d(-12),text:"Account audit started. Conversion tag firing twice on thank-you page."},
    {id:"u7",clientId:"c4",kind:"change",date:d(-2),text:"Switched Shopping to target ROAS 400%. Excluded low-margin silver category."},
    {id:"u8",clientId:"c4",kind:"change",date:d(-16),text:"Added 120 negative keywords from search terms."},
    {id:"u9",clientId:"c5",kind:"note",date:d(-20),text:"Campaigns paused till November. Nothing running."}],
  deadlines:[
    {id:"t1",priority:"high",clientId:"c1",title:"Monthly performance report",type:"report",date:d(-2),repeat:"monthly",done:false},
    {id:"t2",priority:"medium",clientId:"c2",title:"Weekly report",type:"report",date:d(1),repeat:"weekly",done:false},
    {id:"t3",priority:"high",clientId:"c3",title:"Fix double-firing conversion tag",type:"optim",date:d(-1),repeat:"",done:false},
    {id:"t4",priority:"high",clientId:"c1",title:"Diwali campaign goes live",type:"launch",date:d(4),repeat:"",done:false},
    {id:"t5",priority:"medium",clientId:"c1",title:"Diwali creatives approved",type:"creative",date:d(2),repeat:"",done:false},
    {id:"t6",priority:"low",clientId:"c4",title:"Review call with Meera",type:"call",date:d(5),repeat:"",done:false},
    {id:"t7",priority:"medium",clientId:"c3",title:"Kick-off call",type:"call",date:d(2),repeat:"",done:false},
    {id:"t8",priority:"low",clientId:"c4",title:"Fix Merchant Center disapprovals",type:"optim",date:d(9),repeat:"",done:false}],
  links:[
    {id:"l1",clientId:"c1",label:"Daily spend tracker",url:"https://docs.google.com/spreadsheets/d/kaveri-spend"},
    {id:"l2",clientId:"c1",label:"Monthly report",url:"https://lookerstudio.google.com/reporting/kaveri"},
    {id:"l3",clientId:"c1",label:"Diwali creatives",url:"https://drive.google.com/drive/folders/kaveri"},
    {id:"l4",clientId:"c2",label:"Audience test plan",url:"https://docs.google.com/spreadsheets/d/luma-tests"},
    {id:"l5",clientId:"c4",label:"Festive budget sheet",url:"https://docs.google.com/spreadsheets/d/sona-budget"}],
  logins:[
    {id:"g1",clientId:"c1",user:"harsha@kaverifoods.in",pw:"kaveri@2026"},
    {id:"g2",clientId:"c1",user:"ads@kaverifoods.in",pw:"gads@2026"},
    {id:"g3",clientId:"c2",user:"harsha@lumaskin.com",pw:"luma@2026"},
    {id:"g4",clientId:"c4",user:"harsha.sona@gmail.com",pw:"sona@2026"},
    {id:"g5",clientId:"",user:"harsha.mgc@gmail.com",pw:"mgc@2026"}]});

/* ---------- derived ---------- */
const clientName=id=>byId(S.clients,id)?.name||"";
const agencyName=id=>byId(S.agencies,id)?.name||"Direct";
const sortedClients=()=>S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name));
const agencyGroups=()=>S.agencies.slice().sort((a,b)=>a.name.localeCompare(b.name)).concat([{id:"",name:"Direct clients"}])
  .map(a=>({...a,clients:sortedClients().filter(c=>(c.agencyId||"")===a.id)}));
const updatesOf=cid=>S.updates.filter(u=>u.clientId===cid).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const lastCheck=cid=>{const l=updatesOf(cid)[0]?.date||null;return l&&l>t0?t0:l};
const lastChange=cid=>updatesOf(cid).find(u=>u.kind==="change")||null;
function freshness(c){const l=lastCheck(c.id);if(!l)return{cls:"bad",days:null,ratio:2};
  const days=-diff(l),ratio=days/(c.every||7);return{cls:ratio>1?"bad":ratio>=.7?"warn":"ok",days,ratio}}
const open=cid=>S.deadlines.filter(t=>!t.done&&(!cid||t.clientId===cid)).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
const late=cid=>open(cid).filter(t=>t.date&&t.date<t0);
const stale=()=>S.clients.filter(c=>freshness(c).cls==="bad").sort((a,b)=>freshness(b).ratio-freshness(a).ratio);

/* ---------- small pieces ---------- */
const typeTag=k=>{const [l,v]=TYPES[k]||TYPES.other;return `<span class="type"><i style="background:var(${v})"></i>${l}</span>`};
const clientChip=id=>id?`<button class="chip c" data-act="client" data-id="${id}">${esc(clientName(id))}</button>`:"";
const acts=(edit,kind,id)=>`<span class="acts"><button class="icon-btn" data-act="${edit}" data-id="${id}" aria-label="Edit">Edit</button><button class="icon-btn danger" data-act="del" data-k="${kind}" data-id="${id}" aria-label="Delete">Delete</button></span>`;
const empty=(title,body)=>`<div class="empty"><b>${title}</b>${body||""}</div>`;
/* when it was added: stored on new items; older ones carry it in their time-based id */
const addedOf=t=>{if(t.createdAt)return t.createdAt;const n=parseInt(String(t.id).slice(0,8),36);return n>1.5e12&&n<4e12?n:null};
const priOf=t=>PRI[t.priority]?t.priority:"medium";
function dueCell(t){
  if(!t.date)return `<span class="due muted">No due date</span>`;
  const n=diff(t.date),dt=toD(t.date),yr=dt.getFullYear()!==new Date().getFullYear()?" "+dt.getFullYear():"";
  const cls=t.done?"":n<0?"bad":n===0?"warn":"";
  const tag=t.done?"":n<0?`<span class="chip bad">Late</span>`:n===0?`<span class="chip warn">Today</span>`:"";
  return `<span class="due ${cls}">Due ${DAY[dt.getDay()]}, ${fmt(t.date)}${yr}${tag}</span>`}
function dlRow(t,showClient){const a=addedOf(t),p=priOf(t);
  return `<div class="row dl"><input type="checkbox" class="chk" data-act="toggle" data-id="${t.id}" ${t.done?"checked":""} aria-label="Mark ${esc(t.title)} done">
  <div class="grow"><div class="line1"><div class="t ${t.done?"done":""}">${hl(t.title)}</div></div>
  <div class="sub"><span class="pri ${p}">${PRI[p]}</span>${dueCell(t)}${showClient?clientChip(t.clientId):""}${t.type&&t.type!=="other"?typeTag(t.type):""}${t.repeat?`<span>↻ ${t.repeat==="weekly"?"weekly":"monthly"}</span>`:""}${a?`<span class="sep">·</span><span>Added ${fmt(dstr(new Date(a)))}</span>`:""}${t.pushed?`<span class="chip warn" title="Times the due date was moved">↷ moved ${t.pushed}×</span>`:""}
  <span class="dl-acts">${acts("edit-deadline","deadlines",t.id)}${t.done?"":`<button class="btn sm ext-btn" data-act="extend" data-id="${t.id}" title="Move the due date one day later">+1 day</button><button class="btn sm done-btn" data-act="toggle" data-id="${t.id}">✓ Done</button>`}</span></div></div></div>`}
function noteItem(u,showClient){
  return `<div class="note"><div class="hd"><span class="kind ${u.kind}">${KINDS[u.kind]||"Note"}</span>${showClient?clientChip(u.clientId):""}<span>${fmt(u.date)} · ${ago(u.date)}</span><span class="acts"><button class="icon-btn" data-act="to-deadline" data-id="${u.id}" title="Move this to Deadlines">Make deadline</button></span>${acts("edit-note","updates",u.id)}</div><p>${hl(u.text)}</p></div>`}
const favColor=u=>/docs\.google\.com\/spreadsheets/.test(u)?"#1E8E3E":/lookerstudio|datastudio/.test(u)?"#4A3FB0":/drive\.google/.test(u)?"#C58A00":/docs\.google/.test(u)?"#2459C9":"#626C7C";
const favText=u=>/spreadsheets/.test(u)?"XLS":/lookerstudio|datastudio/.test(u)?"RPT":/drive\.google/.test(u)?"DRV":/docs\.google/.test(u)?"DOC":"URL";
function linkRow(l,showClient){const u=safeUrl(l.url);
  return `<div class="row"><span class="fav" style="background:${favColor(u)}" aria-hidden="true">${favText(u)}</span><div class="lk grow"><a href="${esc(u)}" target="_blank" rel="noopener">${hl(l.label||host(u))}</a><small>${esc(host(u))}${showClient?" · "+esc(clientName(l.clientId)):""}</small></div>
  ${acts("edit-link","links",l.id)}<button class="copy" data-act="copy" data-text="${esc(u)}">Copy</button></div>`}
function loginRow(g,showClient){
  return `<div class="login">${showClient?`<div class="who">${g.clientId?esc(clientName(g.clientId)):"General"}</div>`:""}
  <div class="cred"><span class="k">Email</span><span class="v" title="${esc(g.user)}">${hl(g.user)}</span><button class="copy" data-act="copy" data-text="${esc(g.user)}">Copy</button></div>
  <div class="cred"><span class="k">Pass</span><span class="v">${esc(g.pw)}</span><button class="copy" data-act="copy" data-text="${esc(g.pw)}">Copy</button></div>
  <span class="acts" style="opacity:1"><button class="icon-btn" data-act="edit-login" data-id="${g.id}">Edit</button><button class="icon-btn danger" data-act="del" data-k="logins" data-id="${g.id}">Delete</button></span></div>`}
const clientOptions=(sel,blank="Choose a client…")=>`<option value="">${blank}</option>`+agencyGroups().filter(a=>a.clients.length).map(a=>
  `<optgroup label="${esc(a.name)}">${a.clients.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("");
function composer(cid){
  return `<form class="composer" data-form="note" ${cid?`data-cid="${cid}"`:""}>
  <textarea name="text" rows="2" placeholder="${cid?"What happened with "+esc(clientName(cid))+"? A change you made, a call, anything to remember…":"Write a note: what you changed, what was said on a call, anything to remember…"}" required aria-label="Note"></textarea>
  <div class="bar">${cid?"":`<select class="field" name="clientId" required aria-label="Client">${clientOptions("","Which client?")}</select>`}
  <span class="seg" role="radiogroup" aria-label="Type">${Object.entries(KINDS).map(([k,l])=>`<label><input type="radio" name="kind" value="${k}" ${k==="note"?"checked":""}>${l}</label>`).join("")}<label class="dl-opt"><input type="radio" name="kind" value="deadline">Deadline</label></span>
  <span class="dl-only"><label for="cd-${cid||"x"}">Due</label><input class="field" id="cd-${cid||"x"}" type="date" name="due" min="${t0}">
    <select class="field" name="priority" aria-label="Priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></span>
  <span style="flex:1"></span><span class="hint hide-sm">Ctrl + Enter to save</span><button class="btn pri sm"><span class="note-only">Save note</span><span class="dl-only" style="gap:0">Add deadline</span></button></div></form>`}

/* ---------- views ---------- */
function vToday(){
  const h=new Date().getHours(),greet=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
  const dateLine=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
  if(!S.clients.length)return `<div class="hello"><div><h1>${greet}, Harsha</h1><p class="lead">${dateLine}</p></div></div>
  <div class="welcome"><h2 style="font-size:20px">Let's set up your tracker</h2>
  <ol><li>Add the agencies you work through, like MGC.</li><li>Add the clients you handle under each one (or as direct clients).</li><li>Then save notes, deadlines, links and logins for each client.</li></ol>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="new-agency">+ Add an agency</button><button class="btn" data-act="new-client">+ Add a client</button></div></div>`;
  const lt=late(),st=stale(),o=open(),highN=o.filter(t=>priOf(t)==="high").length;
  // week strip (filters the list below)
  const start=d(S.week*7),days=[0,1,2,3,4,5,6].map(i=>addDays(start,i)),withLate=S.week===0;
  const cells=(withLate?[{k:"late",dn:"Late",dd:lt.length,items:lt,late:true}]:[]).concat(days.map(x=>({k:x,dn:x===t0?"Today":DAY[toD(x).getDay()],dd:toD(x).getDate(),items:o.filter(t=>t.date===x),today:x===t0})));
  const wlabel=S.week===0?"This week":S.week===1?"Next week":S.week===-1?"Last week":fmt(days[0])+" – "+fmt(days[6]);
  const sel=S.day&&cells.find(c=>c.k===S.day);
  const list=sel?sel.items:o;
  const byDue=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999");
  let body;
  if(!list.length)body=empty(sel?"Nothing due that day":"No open deadlines",sel?"":"Add one in the box above.");
  else if(S.sort==="due")body=`<div class="list">${list.slice().sort((a,b)=>byDue(a,b)||PRI_RANK[priOf(a)]-PRI_RANK[priOf(b)]).map(t=>dlRow(t,true)).join("")}</div>`;
  else body=["high","medium","low"].map(p=>{const ts=list.filter(t=>priOf(t)===p).sort(byDue);
    return ts.length?`<div class="dayhead pri-h ${p}"><span>${PRI[p]} priority</span><span>${ts.length}</span></div><div class="list">${ts.map(t=>dlRow(t,true)).join("")}</div>`:""}).join("");
  const doneList=S.deadlines.filter(t=>t.done).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,15);
  return `<div class="hello"><div><h1>Deadlines</h1><p class="lead">${greet}, Harsha · ${dateLine}</p></div>

    ${body}
    ${doneList.length&&!sel?`<details style="padding:10px 16px;border-top:1px solid var(--line)"><summary class="muted" style="cursor:pointer;font-size:13px">Done (${S.deadlines.filter(t=>t.done).length})</summary><div class="list">${doneList.map(t=>dlRow(t,true)).join("")}</div></details>`:""}
  </div>
  <div class="panel"><div class="panel-h"><h2>Clients to check</h2><span class="chip ${st.length?"bad":"ok"}">${st.length}</span></div>

function vClients(){

    return `<div class="sec"><div class="sec-h"><h2>${esc(a.name)} <span class="muted mono" style="font-size:13px">${a.clients.length}</span></h2>
    ${a.id?`<span style="display:flex;gap:4px"><button class="btn sm ghost" data-act="new-client" data-agency="${a.id}">+ Client</button><button class="icon-btn" data-act="edit-agency" data-id="${a.id}">Rename</button><button class="icon-btn danger" data-act="del" data-k="agencies" data-id="${a.id}">Delete</button></span>`:""}</div>

      <span class="chip ${f.cls}"><span class="dot ${f.cls}"></span>${f.days===null?"Never checked":f.days===0?"Checked today":"Checked "+f.days+"d ago"}</span></div>
      <div class="ln"><span>Last change</span><span>${lc?esc(lc.text.split("\n")[0]):"None logged"}</span></div>

      <div class="ft"><span>${S.links.filter(l=>l.clientId===c.id).length} links</span><span>${S.logins.filter(g=>g.clientId===c.id).length} logins</span><span>${(c.platforms||[]).join(", ")}</span></div></button>`}).join("")}</div>`
      :`<div class="panel">${empty("No clients yet",`<div style="margin-top:8px"><button class="btn sm" data-act="new-client" data-agency="${a.id}">+ Add a client to ${esc(a.name)}</button></div>`)}</div>`}</div>`}).join("")}`}
function vClient(){

  const f=freshness(c),ups=updatesOf(c.id).filter(u=>S.filter==="all"||u.kind===S.filter);
  const o=open(c.id),done=S.deadlines.filter(t=>t.clientId===c.id&&t.done);
  const links=S.links.filter(l=>l.clientId===c.id),logins=S.logins.filter(g=>g.clientId===c.id);
  return `<div><button class="back" data-act="nav" data-v="clients">← Clients</button>
  <div class="ch" style="margin-top:8px"><div><h1>${esc(c.name)}</h1>
  <div class="status"><span class="chip ${f.cls}"><span class="dot ${f.cls}"></span>${f.days===null?"Never checked":f.days===0?"Checked today":"Last checked "+f.days+" days ago"}</span>
  <span>${esc(agencyName(c.agencyId))}</span>${(c.platforms||[]).length?`<span>·</span><span>${c.platforms.map(esc).join(", ")}</span>`:""}<span>·</span><span>Check ${esc(EVERY[c.every]||"every week")}</span></div></div>
  <button class="btn" data-act="edit-client" data-id="${c.id}">Edit client</button></div></div>
  ${composer(c.id)}
  <div class="cols" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
  <div class="panel"><div class="panel-h"><h2>Notes</h2><div class="ftabs">${[["all","All"],["change","Changes"],["note","Notes"],["call","Calls"]].map(([k,l])=>`<button class="ftab ${S.filter===k?"on":""}" data-act="filter" data-k="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div></div>
    <div class="list">${ups.map(u=>noteItem(u,false)).join("")||empty(S.filter==="all"?"No notes yet":"Nothing here","Use the box above to add one.")}</div></div>
  <div class="sec" style="gap:20px">
    <div class="panel"><div class="panel-h"><h2>Deadlines</h2><button class="btn sm ghost" data-act="new-deadline" data-cid="${c.id}">+ Add</button></div>
      <div class="list">${o.map(t=>dlRow(t,false)).join("")||empty("Nothing due","")}</div>
      ${done.length?`<details style="padding:8px 16px;border-top:1px solid var(--line)"><summary class="muted" style="cursor:pointer;font-size:13px">${done.length} done</summary><div class="list">${done.map(t=>dlRow(t,false)).join("")}</div></details>`:""}</div>
    <div class="panel"><div class="panel-h"><h2>Sheets &amp; reports</h2><button class="btn sm ghost" data-act="new-link" data-cid="${c.id}">+ Add</button></div>
      <div class="list">${links.map(l=>linkRow(l,false)).join("")||empty("No links yet","")}</div></div>

      <div class="list">${logins.map(g=>loginRow(g,false)).join("")||empty("No logins yet","")}</div></div>
  </div></div>`}
function vLinks(){
  const gs=agencyGroups().flatMap(a=>a.clients).map(c=>[c,S.links.filter(l=>l.clientId===c.id)]).filter(([,ls])=>ls.length);
  return `<div class="ch"><div><h1>Links</h1><p class="lead">${S.links.length} sheets, reports and folders. Type a client name in search to see only theirs.</p></div><button class="btn pri" data-act="new-link">+ Link</button></div>
  ${gs.map(([c,ls])=>`<div class="panel"><div class="panel-h"><h2><button class="back" style="color:var(--ink)" data-act="client" data-id="${c.id}">${esc(c.name)}</button> <span class="muted" style="font:400 13px var(--f-body)">${esc(agencyName(c.agencyId))}</span></h2><button class="btn sm ghost" data-act="new-link" data-cid="${c.id}">+ Add</button></div><div class="list">${ls.map(l=>linkRow(l,false)).join("")}</div></div>`).join("")
    ||`<div class="panel">${empty("No links yet",`<div style="margin-top:8px"><button class="btn sm pri" data-act="new-link">+ Add your first link</button></div>`)}</div>`}`}
function vLogins(){
  const gs=[["General","Not tied to one client",S.logins.filter(g=>!g.clientId),""]].concat(agencyGroups().flatMap(a=>a.clients).map(c=>[c.name,agencyName(c.agencyId),S.logins.filter(g=>g.clientId===c.id),c.id])).filter(x=>x[2].length);
  return `<div class="ch"><div><h1>Logins</h1><p class="lead">${S.logins.length} email IDs and passwords. Tap Copy to grab one.</p></div><button class="btn pri" data-act="new-login">+ Login</button></div>
  ${gs.map(([n,sub,ls,cid])=>`<div class="panel"><div class="panel-h"><h2>${esc(n)} <span class="muted" style="font:400 13px var(--f-body)">${esc(sub)}</span></h2><button class="btn sm ghost" data-act="new-login" data-cid="${cid}">+ Add</button></div><div class="list">${ls.map(g=>loginRow(g,false)).join("")}</div></div>`).join("")
    ||`<div class="panel">${empty("No logins yet","")}</div>`}`}
function vSearch(){
  const q=S.q.toLowerCase(),ags=S.agencies.filter(a=>a.name.toLowerCase().includes(q)).map(a=>a.id);
  const cs=sortedClients().filter(c=>c.name.toLowerCase().includes(q)||ags.includes(c.agencyId));const ids=new Set(cs.map(c=>c.id));
  const oU=S.updates.filter(u=>!ids.has(u.clientId)&&u.text.toLowerCase().includes(q));
  const oD=open().filter(t=>!ids.has(t.clientId)&&t.title.toLowerCase().includes(q));
  const oG=S.logins.filter(g=>!ids.has(g.clientId)&&(g.user||"").toLowerCase().includes(q));
  const oL=S.links.filter(l=>!ids.has(l.clientId)&&((l.label||"")+" "+l.url).toLowerCase().includes(q));
  const total=cs.length+oU.length+oD.length+oG.length+oL.length;
  return `<div class="ch"><div><h1>Search</h1><p class="lead">${total} ${total===1?"result":"results"} for “${esc(S.q)}”</p></div><button class="btn" data-act="clear-search">Clear</button></div>
  ${cs.map(c=>{const f=freshness(c),ls=S.links.filter(l=>l.clientId===c.id),gs=S.logins.filter(g=>g.clientId===c.id),us=updatesOf(c.id).slice(0,2);
    return `<div class="result"><div class="panel-h"><div><h2>${hl(c.name)}</h2><span class="muted" style="font-size:13px">${esc(agencyName(c.agencyId))} · ${f.days===null?"never checked":"checked "+agoShort(f.days)+(f.days?" ago":"")}</span></div><button class="btn sm pri" data-act="client" data-id="${c.id}">Open</button></div>
    <div class="list">${ls.map(l=>linkRow(l,false)).join("")}${gs.map(g=>loginRow(g,false)).join("")}${us.map(u=>noteItem(u,false)).join("")}${!ls.length&&!gs.length&&!us.length?empty("Nothing saved for this client yet",""):""}</div></div>`}).join("")}
  ${oU.length?`<div class="panel"><div class="panel-h"><h2>Notes</h2></div><div class="list">${oU.map(u=>noteItem(u,true)).join("")}</div></div>`:""}
  ${oD.length?`<div class="panel"><div class="panel-h"><h2>Deadlines</h2></div><div class="list">${oD.map(t=>dlRow(t,true)).join("")}</div></div>`:""}
  ${oL.length?`<div class="panel"><div class="panel-h"><h2>Links</h2></div><div class="list">${oL.map(l=>linkRow(l,true)).join("")}</div></div>`:""}
  ${oG.length?`<div class="panel"><div class="panel-h"><h2>Logins</h2></div><div class="list">${oG.map(g=>loginRow(g,true)).join("")}</div></div>`:""}
  ${!total?`<div class="panel">${empty("No matches","Try a client name, part of an email, or a word from a note.")}</div>`:""}`}

  const items=[["today","Deadlines",lt?`<span class="n bad">${lt}</span>`:""],["clients","Clients",`<span class="n">${S.clients.length}</span>`],["links","Links",`<span class="n">${S.links.length}</span>`],["logins","Logins",`<span class="n">${S.logins.length}</span>`]];

  <nav class="nav" aria-label="Sections">${items.map(([k,l,n])=>`<button class="nb ${cur===k?"on":""}" data-act="nav" data-v="${k}" ${cur===k?'aria-current="page"':""}>${ICON[k]}${l}${n}</button>`).join("")}</nav>
  <div class="tree"><div class="tree-h"><span>Your clients</span><button class="icon-btn" data-act="new-client" aria-label="Add client">+</button></div>

  schedulePersist()}

/* ---------- toast with undo ---------- */
let undoSnap=null,toastT=null;

  el.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button data-act="undo">Undo</button>`:""}</div>`;
  clearTimeout(toastT);toastT=setTimeout(()=>{el.innerHTML="";undoSnap=null},undo?6000:2400)}
const snapshot=()=>JSON.parse(JSON.stringify({agencies:S.agencies,clients:S.clients,updates:S.updates,deadlines:S.deadlines,links:S.links,logins:S.logins}));

/* ---------- events ---------- */
const q=document.getElementById("q");
q.addEventListener("input",()=>{S.q=q.value.trim();render()});
function go(v,id){S.view=v;S.clientId=id||null;S.q="";q.value="";if(v!=="client")S.filter="all";closeModal();render();window.scrollTo(0,0)}
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const fd=new FormData(f),g=k=>String(fd.get(k)??"").trim(),kind=f.dataset.form;
  if(kind==="signin"){signIn(f,fd.get("password"));return}
  const upsert=(k,data,msg)=>{const ex=M&&M.id&&byId(S[k],M.id);if(ex)Object.assign(ex,data);else S[k].push({id:newId(),...data});closeModal();toast(ex?"Saved":msg);return ex};
  if(kind==="note"){const cid=f.dataset.cid||g("clientId");
    if(g("kind")==="deadline"){S.deadlines.push({id:newId(),clientId:cid,title:g("text"),date:g("due"),type:"other",priority:g("priority")||"medium",repeat:"",done:false,createdAt:Date.now()});
      toast("Deadline added"+(g("due")?", due "+fmt(g("due")):"")+". It's on the Deadlines page.")}
    else{S.updates.push({id:newId(),clientId:cid,kind:g("kind")||"note",date:t0,text:g("text")});toast("Note saved to "+clientName(cid))}}
  if(kind==="note-modal")upsert("updates",{clientId:g("clientId"),kind:g("kind")||"note",text:g("text"),date:(g("date")&&g("date")<=t0)?g("date"):t0},"Note saved to "+clientName(g("clientId")));
  if(kind==="deadline"){const ex=M&&M.id&&byId(S.deadlines,M.id),fromNote=M&&M.fromNote,snap=fromNote?snapshot():null;
    if(fromNote){S.updates=S.updates.filter(u=>u.id!==fromNote)}
    upsert("deadlines",{title:g("title"),clientId:g("clientId"),date:g("date"),type:g("type")||"other",priority:g("priority")||"medium",repeat:g("repeat"),done:ex?ex.done:false,createdAt:ex?(ex.createdAt||addedOf(ex)):Date.now()},"Deadline added");
    if(fromNote)toast("Moved to Deadlines",snap)}
  if(kind==="quick-deadline"){S.deadlines.push({id:newId(),title:g("title"),clientId:g("clientId"),date:g("date"),type:"other",priority:g("priority")||"medium",repeat:"",done:false,createdAt:Date.now()});
    toast("Deadline added for "+clientName(g("clientId")));render();setTimeout(()=>{const x=document.querySelector('form[data-form="quick-deadline"] input[name="title"]');x&&x.focus()},0);return}
  if(kind==="client"){const data={name:g("name"),agencyId:g("agencyId"),every:+g("every")||7,platforms:fd.getAll("platforms")};
    if(M&&M.id){upsert("clients",data,"")}else{const id=newId();S.clients.push({id,...data});closeModal();go("client",id);toast("Client added. Add a note, link or login below.");return}}
  if(kind==="agency")upsert("agencies",{name:g("name")},"Agency added");
  if(kind==="link")upsert("links",{url:safeUrl(g("url")),label:g("label"),clientId:g("clientId")},"Link added");
  if(kind==="login")upsert("logins",{user:g("user"),pw:String(fd.get("pw")??""),clientId:g("clientId")},"Login saved");
  render();
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,ds=el.dataset;
  const here=S.view==="client"?S.clientId:"";
  if(a==="close-bg"){if(e.target===el)closeModal();return}
  if(a==="close")closeModal();
  else if(a==="nav"){S.day=null;go(ds.v)}
  else if(a==="client")go("client",ds.id);
  else if(a==="clear-search"){S.q="";q.value="";render()}
  else if(a==="day"){S.day=S.day===ds.k?null:ds.k;render()}
  else if(a==="week"){S.week=+ds.d===0?0:S.week+(+ds.d);S.day=null;render()}
  else if(a==="filter"){S.filter=ds.k;render()}
  else if(a==="to-deadline"){const u=byId(S.updates,ds.id);if(!u)return;
    deadlineForm({clientId:u.clientId,title:u.text.split("\n")[0],date:u.date>t0?u.date:"",priority:"medium"});M.fromNote=u.id}
  else if(a==="note-to-deadline-form"){const f=document.querySelector("#modal form");const fd=new FormData(f);
    deadlineForm({clientId:String(fd.get("clientId")||""),title:String(fd.get("text")||"").split("\n")[0]})}
  else if(a==="extend"){const t=byId(S.deadlines,ds.id);if(!t)return;const snap=snapshot();
    const base=!t.date||t.date<t0?t0:t.date;t.date=addDays(base,1);t.pushed=(t.pushed||0)+1;
    toast("Moved to "+DAY[toD(t.date).getDay()]+", "+fmt(t.date),snap);render()}
  else if(a==="sort"){S.sort=ds.k;try{localStorage.setItem("ht-sort",ds.k)}catch(_){}render()}
  else if(a==="new-note")noteForm({clientId:ds.cid||here});
  else if(a==="edit-note")noteForm(byId(S.updates,ds.id));
  else if(a==="new-deadline")deadlineForm({clientId:ds.cid||here});
  else if(a==="edit-deadline")deadlineForm(byId(S.deadlines,ds.id));
  else if(a==="new-client")clientForm({agencyId:ds.agency||""});
  else if(a==="edit-client")clientForm(byId(S.clients,ds.id));
  else if(a==="new-agency")agencyForm({});
  else if(a==="edit-agency")agencyForm(byId(S.agencies,ds.id));
  else if(a==="new-link")linkForm({clientId:ds.cid??here});
  else if(a==="edit-link")linkForm(byId(S.links,ds.id));
  else if(a==="new-login")loginForm({clientId:ds.cid??here});
  else if(a==="edit-login")loginForm(byId(S.logins,ds.id));
  else if(a==="toggle"){const t=byId(S.deadlines,ds.id);const snap=snapshot();t.done=!t.done;
    if(t.done&&t.repeat&&!t.spawned&&t.date){const next=t.repeat==="weekly"?addDays(t.date,7):addMonth(t.date);t.spawned=true;
      S.deadlines.push({id:newId(),clientId:t.clientId,title:t.title,type:t.type,priority:priOf(t),repeat:t.repeat,date:next,done:false,createdAt:Date.now()});toast("Done. Next one is on "+fmt(next),snap)}
    else toast(t.done?"Marked done":"Marked not done",t.done?snap:null);render()}
  else if(a==="copy"){try{await navigator.clipboard.writeText(ds.text);toast("Copied")}catch(_){toast("Couldn't copy. Select the text instead.")}}
  else if(a==="del"){const k=ds.k,id=ds.id,snap=snapshot();const name={updates:"Note",deadlines:"Deadline",links:"Link",logins:"Login",clients:"Client",agencies:"Agency"}[k];
    S[k]=S[k].filter(x=>x.id!==id);
    if(k==="clients"){for(const c of ["deadlines","updates","links","logins"])S[c]=S[c].filter(x=>x.clientId!==id)}
    if(k==="agencies")S.clients.forEach(c=>{if(c.agencyId===id)c.agencyId=""});
    closeModal();if(k==="clients"&&S.clientId===id){S.view="clients";S.clientId=null}
    toast(name+" deleted",snap);render()}
  else if(a==="logout"){try{await fetch("/api/login",{method:"DELETE"})}catch(_){}location.reload()}
  else if(a==="retry-save")persist();
  else if(a==="undo"&&undoSnap){Object.assign(S,undoSnap);undoSnap=null;document.getElementById("toast").innerHTML="";render()}
});
document.addEventListener("keydown",e=>{
  if(document.getElementById("app").hidden)return;
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if(e.key==="Escape"){if(M||document.querySelector("#modal .overlay"))closeModal();else if(S.q){S.q="";q.value="";render()}else if(typing)document.activeElement.blur()}
  else if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){const f=document.activeElement?.closest("form");if(f){e.preventDefault();f.requestSubmit()}}
  else if(!typing&&!document.querySelector("#modal .overlay")){
    if(e.key==="/"){e.preventDefault();q.focus()}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();noteForm({clientId:S.view==="client"?S.clientId:""})}}
});
try{const v=localStorage.getItem("ht-sort");if(v==="due"||v==="priority")S.sort=v}catch(_){}
setInterval(()=>{if(dstr(new Date())!==t0&&!document.getElementById("app").hidden&&!document.querySelector("#modal .overlay"))render()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&dstr(new Date())!==t0&&!document.getElementById("app").hidden)render()});
/* ---------- loading & saving ---------- */
const KINDS_LIST=["agencies","clients","updates","deadlines","links","logins"];
let MODE="loading",saved=null,saving=false,again=false,persistT=null;
const $=id=>document.getElementById(id);
function showApp(){$("login").hidden=true;$("app").hidden=false}
function showLogin(msg){$("app").hidden=true;$("login").hidden=false;$("login-msg").textContent=msg||"Sign in to see your clients.";$("login-err").textContent="";setTimeout(()=>$("pw").focus(),30)}
function load(data){for(const k of KINDS_LIST)S[k]=Array.isArray(data[k])?data[k]:[];saved=snapshot();showApp();render()}
async function boot(){
  $("view").innerHTML=`<div class="empty">Loading your tracker…</div>`;
  let r=null;try{r=await fetch("/api/data",{cache:"no-store"})}catch(_){}
  if(r&&r.status===401){MODE="live";showLogin();return "login"}
  if(r&&r.ok&&(r.headers.get("content-type")||"").includes("json")){MODE="live";load(await r.json());return "app"}
  if(r&&r.status>=500){MODE="live";const msg=(await r.json().catch(()=>({}))).error||"The server didn't respond.";
    showApp();$("view").innerHTML=`<div class="panel">${empty("Couldn't load your data",esc(msg)+" Reload the page to try again. If it keeps happening, check the database is connected to this project in Vercel → Storage.")}</div>`;return "error"}
  MODE="preview";$("banner").hidden=false;load(sampleData());return "app"}
async function signIn(form,password){
  const btn=form.querySelector("button"),err=$("login-err");btn.disabled=true;err.textContent="";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password})});
    if(r.ok){
      if(saved){form.reset();showApp();render();persist();return}
      const next=await boot();
      if(next==="login")err.textContent="The password was right, but this browser didn't keep you signed in. Allow cookies for this site (or turn off strict tracking protection for it) and try again.";
      else form.reset()}
    else err.textContent=(await r.json().catch(()=>({}))).error||"That password is wrong."}
  catch(_){err.textContent="Couldn't reach the server. Check your connection and try again."}
  finally{btn.disabled=false}}
function setSave(state){const el=$("save");if(!el)return;el.className="save "+state;
  el.innerHTML=state==="saving"?"Saving…":state==="saved"?"✓ Saved":state==="error"?`Not saved <button data-act="retry-save">Retry</button>`:"";
  if(state==="saved"){clearTimeout(setSave.t);setSave.t=setTimeout(()=>{if(el.className==="save saved")el.innerHTML=""},2500)}}
function schedulePersist(){if(MODE!=="live"||!saved)return;clearTimeout(persistT);persistT=setTimeout(persist,300)}
function diffOps(){const ops=[];
  for(const k of KINDS_LIST){const before=new Map(saved[k].map(x=>[x.id,JSON.stringify(x)])),now=new Set();
    for(const x of S[k]){now.add(x.id);if(before.get(x.id)!==JSON.stringify(x))ops.push({op:"put",kind:k,id:x.id,data:x})}
    for(const id of before.keys())if(!now.has(id))ops.push({op:"del",kind:k,id})}
  return ops}
async function persist(){
  if(MODE!=="live"||!saved)return;
  if(saving){again=true;return}
  const ops=diffOps();if(!ops.length)return;
  saving=true;setSave("saving");const next=snapshot();
  try{const r=await fetch("/api/data",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ops})});
    if(r.status===401){setSave("error");showLogin("You were signed out. Sign in again and your last change will be saved.");return}
    if(!r.ok)throw new Error("save failed");
    saved=next;setSave("saved")}
  catch(_){setSave("error")}
  finally{saving=false;if(again){again=false;persist()}}}
window.addEventListener("beforeunload",e=>{if(MODE==="live"&&saved&&diffOps().length){e.preventDefault();e.returnValue=""}});
boot();
</script></body>
</html>
